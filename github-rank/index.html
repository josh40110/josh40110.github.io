<body>
<div class="wrap">
  <header>
    <h1><small>GITHUB LEADERBOARD</small>GitHub 風雲榜</h1>
    <div class="status">
      <span>資料抓取於 <time id="updated">讀取中</time></span>
      <button class="btn" id="reload" type="button">重新讀取榜單</button>
      <span id="hint" role="status"></span>
    </div>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="榜單">
      <button class="tab" role="tab" id="tab-hot" data-tab="hot" type="button">最紅專案<span id="n-hot"></span></button>
      <button class="tab" role="tab" id="tab-new" data-tab="new" type="button">最新專案<span id="n-new"></span></button>
      <button class="tab" role="tab" id="tab-devs" data-tab="devs" type="button">最紅開發者<span id="n-devs"></span></button>
    </div>
    <div class="tools">
      <input id="find" type="search" placeholder="搜尋名稱、分析、標籤" aria-label="搜尋榜單">
      <select id="lang" aria-label="程式語言"></select>
      <select id="sort" aria-label="排序">
        <option value="rank">依榜單名次</option>
        <option value="daily">平均每日 Star 多到少</option>
        <option value="forks">Fork 多到少</option>
        <option value="created">建立時間新到舊</option>
        <option value="pushed">最近更新新到舊</option>
      </select>
    </div>
  </div>

  <p class="lede" id="lede"></p>
  <main id="list" class="list"><div class="msg">讀取榜單中</div></main>

  <footer>
    <p>資料來源：GitHub 官方 Search API，由本機的 crawler.py 抓取；範例圖取自各專案 README 的第一張圖，找不到時改用 GitHub 自動產生的預覽卡。</p>
    <p>中文名稱與 50 字內分析由 Claude 依專案名稱與官方說明撰寫，僅供快速瀏覽。頁面開著時每 10 分鐘自動檢查有沒有新資料。</p>
  </footer>
</div>
