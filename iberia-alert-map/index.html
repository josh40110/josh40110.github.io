  <form class="gatebox" id="gateform" autocomplete="on">
    <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    <h1>伊比利行程警示圖</h1>
    <div class="seg2" role="group" aria-label="登入或註冊"><button type="button" id="g-login" aria-pressed="true">登入</button><button type="button" id="g-reg" aria-pressed="false">註冊</button></div>
    <input id="g-user" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="帳號（英文或數字）" required aria-label="帳號">
    <input id="g-pass" type="password" autocomplete="current-password" placeholder="密碼（至少 6 個字）" required minlength="6" aria-label="密碼">
    <input id="g-invite" type="text" autocapitalize="characters" spellcheck="false" placeholder="邀請碼" aria-label="邀請碼" hidden>
    <button class="btn primary" id="gatebtn" type="submit">登入</button>
    <div class="gatemsg" id="gatemsg" role="alert"></div>
    <p class="gatehint" id="gatehint">還沒有帳號？按上面的「註冊」，輸入邀請碼。</p>
  </form>
</div>

  <div id="map" role="region" aria-label="西班牙與葡萄牙地圖"></div>

    <div class="row1">

      </div>

    <div class="chips" id="nav" hidden></div>
    <div class="chips" id="chips"></div>

  </div>

  <div class="toast" id="toast" hidden></div>
